# version: "3.8"
services:
  dbsipjaki:
    image: mariadb:latest
    container_name: contsipjaki
    restart: unless-stopped
    networks:
      - optima
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: root
      MARIADB_PASSWORD: root
    volumes:
      - ./config/50-server.cnf:/etc/mysql/mariadb.conf.d/50-server.cnf
      - ./data:/home
    ports:
      - 12888:3306

  # phpmyadmin:
  #   image: phpmyadmin
  #   container_name: phpmyadmin
  #   restart: unless-stopped
  #   networks:
  #     - optima
  #   ports:
  #     - 8008:80
  #   environment:
  #     - PMA_ARBITRARY=1

volumes:
  dbsipjaki:

networks:
  optima:
    external: true